# Alembic config. The DATABASE_URL is resolved in alembic/env.py from the
# environment (do NOT hardcode credentials here). Run with:
#
#   DATABASE_URL=... uv run alembic upgrade head
#   DATABASE_URL=... uv run alembic revision -m "describe change"
#   DATABASE_URL=... uv run alembic current
#
# Or use the Makefile shortcuts (make migrate-dev / make migrate-prod).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = UTC

# Format version files as: 0042_short_slug.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
