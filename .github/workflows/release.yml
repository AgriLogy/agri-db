name: release

# Manual trigger only. Per the release flow, the user dispatches this; it
# reads conventional commits since the last tag, computes the next version,
# rewrites src/agri/db/_version.py, updates CHANGELOG.md, tags (bare
# {version}), and creates a GitHub Release with the built dists attached.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "stable (main) or rc (feat|fix|perf branch)"
        type: choice
        options: [stable, rc]
        default: stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so semantic-release sees all commits/tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        # Pin the author so auto-release commits are attributed to the user,
        # not github-actions[bot] (per memory: mks-zakaria is sole author).
        run: |
          git config user.name "MKS~ZAK"
          git config user.email "60817481+mks-zakaria@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.7"

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.release_type == 'rc' }}
        env:
          GIT_COMMIT_AUTHOR: "MKS~ZAK <60817481+mks-zakaria@users.noreply.github.com>"
