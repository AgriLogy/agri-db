name: migrations

# Gate: every migration must apply cleanly to an EMPTY Postgres before it can
# merge. Mirrors `make migrate-test` (scripts/migrate_test.sh) but uses a
# GitHub service container instead of spinning Docker inside the job.
#
#   1. upgrade head      empty DB -> full schema
#   2. downgrade base    reverse the whole chain
#   3. upgrade head      round-trip
#   4. alembic check     ORM <-> DB drift (informational; does not fail the job)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  empty-db-upgrade:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agri_migtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agri_migtest
      ALEMBIC_INI: src/agri/db/_migrations/alembic.ini

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.7"

      - name: Install dependencies
        run: uv sync

      - name: upgrade head (empty DB -> full schema)
        run: uv run alembic -c "$ALEMBIC_INI" upgrade head

      - name: downgrade base (reverse the whole chain)
        run: uv run alembic -c "$ALEMBIC_INI" downgrade base

      - name: upgrade head again (round-trip)
        run: uv run alembic -c "$ALEMBIC_INI" upgrade head

      - name: alembic check (ORM <-> DB drift — informational)
        continue-on-error: true
        run: uv run alembic -c "$ALEMBIC_INI" check
