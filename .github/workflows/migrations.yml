name: migrations

# Gate: every migration must apply cleanly to an EMPTY Postgres before it can
# merge (upgrade head -> downgrade base -> upgrade head -> alembic check).
# Thin caller — the logic lives in AgriLogy/shared-workflows.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  empty-db-upgrade:
    uses: AgriLogy/shared-workflows/.github/workflows/migrations-gate.yml@v1
    with:
      alembic_ini: src/agri/db/_migrations/alembic.ini
      uv_version: "0.11.6"
