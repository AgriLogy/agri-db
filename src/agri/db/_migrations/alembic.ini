# Alembic config bundled inside the agri.db package.
# DATABASE_URL is resolved in env.py from the environment (no creds
# hardcoded here).
#
# Run via the bundled CLI:
#
#   agri-migrate                 # upgrade head
#   agri-migrate revision -m "x" # full alembic pass-through
#
# Or directly via alembic:
#
#   ALEMBIC_CONFIG=src/agri/db/_migrations/alembic.ini uv run alembic <args>
#
# Makefile shortcuts: make upgrade-dev / make upgrade-prod.

[alembic]
# %(here)s = directory of this ini → makes the bundled path work whether
# the package is run from source or from an installed wheel.
script_location = %(here)s
prepend_sys_path = %(here)s
version_path_separator = os
timezone = UTC

# Format version files as: 0042_short_slug.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
