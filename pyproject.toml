[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-db"
version = "0.1.0"
description = "Schema-of-record for the Agrilogy Supabase Postgres. Source of truth for all DB migrations across the Django and (future) FastAPI backends."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pydantic>=2.13.4",
]

[project.scripts]
# `agri-migrate` → alembic upgrade head against the bundled config.
# Used by downstream services (agri-api, future ingest worker).
agri-migrate = "agri.db._migrations.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "sqlacodegen>=4.0.3",
]

# ---------------------------------------------------------------------------
# Packaging — src/ layout, bundle the migration assets inside the wheel
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agri.db._migrations" = ["alembic.ini", "script.py.mako", "versions/*.py", "versions/*.sql"]
