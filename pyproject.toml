[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-db"
dynamic = ["version"]  # sourced from agri.db._version; owned by semantic-release
description = "Schema-of-record for the Agrilogy Supabase Postgres. Source of truth for all DB migrations across the Django and (future) FastAPI backends."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pydantic>=2.13.4",
]

[project.scripts]
# `agri-migrate` → alembic upgrade head against the bundled config.
# Used by downstream services (agri-api, future ingest worker).
agri-migrate = "agri.db._migrations.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "sqlacodegen>=4.0.3",
]

[tool.setuptools.dynamic]
version = { attr = "agri.db._version.__version__" }

# ---------------------------------------------------------------------------
# python-semantic-release — conventional commits → version bump + tag +
# GitHub release + CHANGELOG. agri-db is consumed by tagged git URL
# (agri-core pins `agri-db @ git+…@<tag>`), so the tag format is BARE
# `{version}` to match the data-model / revly-core convention. agri-api,
# the top-level app consumed by nobody, uses `v{version}`.
# ---------------------------------------------------------------------------
[tool.semantic_release]
tag_format = "{version}"
version_variables = ["src/agri/db/_version.py:__version__"]
# No build step: agri-db is consumed by git tag (agri-core pins
# `agri-db @ git+…@<tag>`), not as a published wheel. The PSR action also
# runs in its own container where project tools like `uv` aren't on PATH.
build_command = ""
commit_message = "{version}\n\n[skip ci] automatically generated by python-semantic-release"
major_on_zero = false
logging_use_named_masks = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.branches.rc]
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.commit_author]
# Sole contributor on every commit, including auto-release commits
# (per memory: no Co-Authored-By, no github-actions[bot] identity).
env = "GIT_COMMIT_AUTHOR"
default = "MKS~ZAK <60817481+mks-zakaria@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

# ---------------------------------------------------------------------------
# Packaging — src/ layout, bundle the migration assets inside the wheel
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agri.db._migrations" = ["alembic.ini", "script.py.mako", "versions/*.py", "versions/*.sql"]
