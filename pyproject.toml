[project]
name = "agrilogy-db"
version = "0.1.0"
description = "Schema-of-record for the Agrilogy Supabase Postgres. Source of truth for all DB migrations across the Django and (future) FastAPI backends."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
]
